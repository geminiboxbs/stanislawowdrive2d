<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanislawow Drive 2D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1d; /* Ciemne, gamingowe tło */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 40px;
            color: #c3073f; /* Akcent kolorystyczny (czerwień/bordo) */
            text-shadow: 2px 2px 10px rgba(195, 7, 63, 0.5);
            letter-spacing: 2px;
        }

        #countdown {
            display: flex;
            gap: 20px;
        }

        .time-box {
            background-color: #4e4e50;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.5);
            min-width: 80px;
        }

        .number {
            font-size: 3.5rem;
            font-weight: bold;
            display: block;
        }

        .label {
            font-size: 1.2rem;
            color: #d3d3d3;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
            display: block;
        }

        /* Responsywność dla telefonów */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            #countdown { flex-wrap: wrap; justify-content: center; gap: 10px; }
            .time-box { padding: 15px 20px; min-width: 60px; }
            .number { font-size: 2.5rem; }
            .label { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <h1>tutaj bedzie Stanislawow Drive 2D!</h1>

    <div id="countdown">
        <div class="time-box">
            <span class="number" id="days">00</span>
            <span class="label">Dni</span>
        </div>
        <div class="time-box">
            <span class="number" id="hours">00</span>
            <span class="label">Godzin</span>
        </div>
        <div class="time-box">
            <span class="number" id="minutes">00</span>
            <span class="label">Minut</span>
        </div>
        <div class="time-box">
            <span class="number" id="seconds">00</span>
            <span class="label">Sekund</span>
        </div>
    </div>

    <script>
        function setupCountdown() {
            const now = new Date();
            let currentYear = now.getFullYear();
            
            // Miesiące w JS są liczone od 0 (styczeń=0, luty=1, marzec=2, kwiecień=3)
            // Ustawiamy na 1 kwietnia, godzina 15:00:00
            let targetDate = new Date(currentYear, 3, 1, 15, 0, 0).getTime();

            // Jeśli 1 kwietnia 15:00 w tym roku już minął, ustawiamy na przyszły rok
            if (now.getTime() > targetDate) {
                targetDate = new Date(currentYear + 1, 3, 1, 15, 0, 0).getTime();
            }

            // Aktualizacja odliczania co 1 sekundę
            const timer = setInterval(function() {
                const currentTime = new Date().getTime();
                const distance = targetDate - currentTime;

                // Obliczenia matematyczne dla czasu
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                // Wstawianie wyników do HTML z dodaniem zera z przodu dla cyfr < 10
                document.getElementById("days").innerText = days;
                document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
                document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
                document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

                // Co się stanie, gdy odliczanie się skończy
                if (distance < 0) {
                    clearInterval(timer);
                    document.getElementById("countdown").innerHTML = "<h2 style='color:#4CAF50;'>Gra jest już dostępna!</h2>";
                }
            }, 1000);
        }

        // Uruchomienie funkcji
        setupCountdown();
    </script>

</body>
</html>
