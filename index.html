<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanisławów Drive 2D (1.0.0)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            font-family: 'Press Start 2P', system-ui, sans-serif;
            background-color: #1a1a2e;
            color: #e94560;
            overflow-x: hidden;
        }
        
        .retro-text {
            text-shadow: 4px 4px 0px #0f3460, 8px 8px 0px #16213e;
            line-height: 1.5;
        }
        
        .panel {
            box-shadow: 8px 8px 0px 0px #16213e;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 text-center">
    
    <main class="w-full max-w-5xl mx-auto flex flex-col items-center justify-center">
        <h1 class="text-2xl md:text-4xl lg:text-5xl font-bold mb-16 retro-text uppercase break-words px-4">
            tutaj bedzie<br><span class="text-white mt-4 inline-block">Stanislawow Drive 2D!</span>
        </h1>

        <div class="bg-[#0f3460] rounded-xl p-6 md:p-10 panel border-4 border-[#e94560] w-full max-w-3xl">
            <h2 class="text-lg md:text-xl mb-8 text-white tracking-widest uppercase">Premiera za:</h2>
            
            <div id="timer" class="flex flex-wrap justify-center items-center gap-2 md:gap-6">
                <!-- Dni -->
                <div class="flex flex-col items-center w-20 md:w-28">
                    <span id="days" class="text-3xl md:text-5xl text-[#e94560]">00</span>
                    <span class="text-xs md:text-sm text-gray-300 mt-4">DNI</span>
                </div>
                
                <div class="text-2xl md:text-5xl text-[#e94560] animate-pulse pb-8">:</div>
                
                <!-- Godziny -->
                <div class="flex flex-col items-center w-20 md:w-28">
                    <span id="hours" class="text-3xl md:text-5xl text-[#e94560]">00</span>
                    <span class="text-xs md:text-sm text-gray-300 mt-4">GODZ</span>
                </div>
                
                <div class="text-2xl md:text-5xl text-[#e94560] animate-pulse pb-8 hidden sm:block">:</div>
                
                <!-- Minuty -->
                <div class="flex flex-col items-center w-20 md:w-28 mt-4 sm:mt-0">
                    <span id="minutes" class="text-3xl md:text-5xl text-[#e94560]">00</span>
                    <span class="text-xs md:text-sm text-gray-300 mt-4">MIN</span>
                </div>
                
                <div class="text-2xl md:text-5xl text-[#e94560] animate-pulse pb-8 mt-4 sm:mt-0">:</div>
                
                <!-- Sekundy -->
                <div class="flex flex-col items-center w-20 md:w-28 mt-4 sm:mt-0">
                    <span id="seconds" class="text-3xl md:text-5xl text-[#e94560]">00</span>
                    <span class="text-xs md:text-sm text-gray-300 mt-4">SEK</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        function initTimer() {
            // Ustawienie docelowej daty: 1 kwietnia, godzina 16:00
            let targetDate = new Date();
            targetDate.setMonth(4); // Miesiące są indeksowane od 0, więc 3 to kwiecień
            targetDate.setDate(1);
            targetDate.setHours(16);
            targetDate.setMinutes(0);
            targetDate.setSeconds(0);
            targetDate.setMilliseconds(0);

            // Jeśli dzisiejsza data jest późniejsza niż 1 kwietnia danego roku, ustaw cel na kolejny rok
            if (targetDate.getTime() < new Date().getTime()) {
                targetDate.setFullYear(targetDate.getFullYear() + 1);
            }

            function updateTimer() {
                const now = new Date().getTime();
                const distance = targetDate.getTime() - now;

                if (distance <= 0) {
                    document.getElementById("timer").innerHTML = "<div class='text-2xl md:text-4xl text-[#e94560] p-4 text-center w-full uppercase leading-relaxed'>Zaczynamy<br><span class='text-white mt-4 inline-block'>jazdę!</span></div>";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                // Formatowanie z zerami z przodu
                document.getElementById("days").innerText = days.toString().padStart(2, '0');
                document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
                document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
                document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
            }

            setInterval(updateTimer, 1000);
            updateTimer(); // Wywołanie od razu, żeby nie było mignięcia
        }

        // Inicjalizacja skryptu po załadowaniu drzewa DOM
        document.addEventListener('DOMContentLoaded', initTimer);
    </script>
</body>
</html>
